[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmacology-research-agent"
version = "0.1.0"
description = "Cited pharmacology research agent orchestrated with LangGraph"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.34.0",
  "openai==1.61.1",
  "langchain-core==0.3.35",
  "langchain-openai==0.3.6",
  "langgraph==0.2.73",
  "numpy==2.2.2",
  "pydantic==2.10.6",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
