<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent de recherche pharmacologique</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
      body { max-width: 880px; margin: 3rem auto; padding: 0 1rem; }
      textarea, button { font: inherit; } textarea { width: 100%; box-sizing: border-box; min-height: 8rem; padding: .8rem; }
      button { margin-top: .8rem; padding: .6rem 1rem; cursor: pointer; } pre { white-space: pre-wrap; line-height: 1.5; }
      #status { min-height: 1.5rem; } .hint { opacity: .72; }
    </style>
  </head>
  <body>
    <h1>Recherche pharmacologique</h1>
    <p class="hint">Réponses limitées au corpus local et accompagnées d’un avertissement médical.</p>
    <label for="question">Question</label>
    <textarea id="question" placeholder="Ex. What are the main contraindications for warfarin?"></textarea>
    <br><button id="submit">Rechercher</button>
    <p id="status" role="status"></p>
    <pre id="answer"></pre>
    <script>
      const question = document.querySelector('#question');
      const button = document.querySelector('#submit');
      const status = document.querySelector('#status');
      const answer = document.querySelector('#answer');
      button.addEventListener('click', async () => {
        answer.textContent = '';
        status.textContent = 'Recherche en cours…';
        button.disabled = true;
        try {
          const response = await fetch('/ask', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question: question.value}) });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || 'Erreur inconnue');
          answer.textContent = data.answer;
          status.textContent = `Terminé — périmètre : ${data.scope}`;
        } catch (error) { status.textContent = `Erreur : ${error.message}`; }
        finally { button.disabled = false; }
      });
    </script>
  </body>
</html>
